- name: Verify the heartbeat worker from inside its allocations
  hosts: "nomad_job_{{ job_name | default('heartbeat') }}"
  connection: benemon.nomad.nomad_exec
  gather_facts: false
  vars:
    ansible_nomad_task: heartbeat
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Read the heartbeat
      ansible.builtin.slurp:
        src: /local/heartbeat
      register: first

    - name: Wait for the heartbeat to advance
      ansible.builtin.slurp:
        src: /local/heartbeat
      register: latest
      until: (latest.content | b64decode).split()[0] | int > first_beat | int
      retries: 6
      delay: 5
      vars:
        first_beat: "{{ (first.content | b64decode).split()[0] }}"

    - name: Report the heartbeat
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} heartbeat {{ first.content | b64decode | trim }} -> {{ latest.content | b64decode | trim }}"
