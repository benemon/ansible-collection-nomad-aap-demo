- name: Deploy a heartbeat worker to Nomad with no exposed ports
  hosts: localhost
  gather_facts: false
  vars:
    job_name: heartbeat
    node_pool: default
  tasks:
    - name: Register the job and wait for its deployment
      benemon.nomad.nomad_job:
        jobspec: "{{ lookup('ansible.builtin.template', 'worker.nomad.hcl.j2') }}"

    - name: Read the job's allocations
      benemon.nomad.nomad_allocation_info:
        job: "{{ job_name }}"
      register: allocs

    - name: Report where the worker runs
      ansible.builtin.debug:
        msg: "{{ item.ID[:8] }} on {{ item.NodeName }}"
      loop: "{{ allocs.allocations | selectattr('ClientStatus', 'eq', 'running') }}"
      loop_control:
        label: "{{ item.ID[:8] }}"
