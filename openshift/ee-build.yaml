apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ee-nomad
  namespace: aap
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ee-nomad
  namespace: aap
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: ee-nomad:latest
  resources:
    limits:
      memory: 2Gi
