inputs:
  fields:
    - id: address
      type: string
      label: Nomad address
    - id: token
      type: string
      label: ACL token
      secret: true
    - id: ca_cert
      type: string
      label: CA certificate
      multiline: true
  required:
    - address
    - token
    - ca_cert
injectors:
  env:
    NOMAD_ADDR: "{{ address }}"
    NOMAD_TOKEN: "{{ token }}"
    NOMAD_CACERT: "{{ tower.filename.ca_cert }}"
  file:
    template.ca_cert: "{{ ca_cert }}"
